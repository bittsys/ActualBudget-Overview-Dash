name: Sync fork with upstream

on:
  schedule:
   - cron: '17 3 * * 1'   # Mondays at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write      # required for the enable endpoint
  workflows: write   # needed when the merge updates workflow files

env:
  WF_FILE: sync-fork.yml  # <- set this to THIS workflow's actual filename

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork via merge-upstream API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -sS -o /tmp/merge.json -w "%{http_code}" -X POST \
            -f -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/merge-upstream" \
            -d '{"branch":"main"}' || true)
          cat /tmp/merge.json; echo
          case "$STATUS" in
            200|201|204) echo "Sync OK" ;;
            *)           echo "::error::merge-upstream failed (HTTP $STATUS)"; exit 1 ;;
          esac

      - name: Keepalive - re-enable workflow to reset 60-day timer
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          API="https://api.github.com/repos/${{ github.repository }}"
          STATUS=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/actions/workflows/$WF_FILE/enable")
          echo "HTTP status: $STATUS"
          cat /tmp/resp.txt; echo
          test "$STATUS" = "204"   # 204 No Content = success
